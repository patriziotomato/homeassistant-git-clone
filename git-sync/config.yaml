name: Git Sync
version: 1.0.2
slug: git_sync
description: Couple your Home Assistant configuration to a GitHub repository — main is the source of truth, local changes collect in a single pull request.
url: https://github.com/patriziotomato/homeassistant-git-clone
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
hassio_api: true
# Least privilege: the app only calls /core/api/services/..., /core/check
# and /core/restart. Per the Supervisor's security middleware /core/.+ is
# granted to the homeassistant role and /core/api/... bypasses the role
# check entirely, so manager — which also grants add-on management,
# including reading other add-ons' configuration and secrets — is broader
# than anything here needs.
hassio_role: homeassistant
ingress: true
ingress_port: 8099
# The app's job is a background loop; a silently wedged poller would stop
# auto-commit and auto-pull with the panel as the only place to notice.
watchdog: http://[HOST]:[PORT:8099]/api/health
panel_icon: mdi:source-branch
panel_title: Git Sync
map:
  - type: homeassistant_config
    read_only: false
options: {}
schema: {}
# Pre-built images on ghcr.io, pushed by .github/workflows/publish.yaml when a
# version tag is pushed. For local development, comment this key out in your own
# copy so Home Assistant builds this folder instead of pulling.
image: ghcr.io/patriziotomato/{arch}-git-sync
