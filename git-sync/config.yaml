name: Git Sync
version: 0.8.0
slug: git_sync
description: Couple your Home Assistant configuration to a GitHub repository — main is the source of truth, local changes collect in a single pull request.
url: https://github.com/patriziotomato/homeassistant-git-clone
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8099
panel_icon: mdi:source-branch
panel_title: Git Sync
map:
  - type: homeassistant_config
    read_only: false
options: {}
schema: {}
# Enabled at publish time (pre-built images on ghcr.io). Keep commented out
# while developing so Home Assistant builds the image locally from this folder:
# image: ghcr.io/patriziotomato/{arch}-git-sync
