name: Builder

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      # Stays on @master: the release tags are not consumable as a Docker
      # action — their Dockerfile has no default for ARG BUILD_FROM, so the
      # action image fails to build. The base images are pinned in build.yaml.
      - name: Test build
        uses: home-assistant/builder@master
        with:
          args: |
            --test \
            --${{ matrix.arch }} \
            --target git-sync \
            --image {arch}-git-sync \
            --docker-hub ghcr.io/patriziotomato
