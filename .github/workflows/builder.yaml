name: Builder

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Test build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - aarch64
          - amd64
          - armv7
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Test build
        uses: home-assistant/builder@master
        with:
          args: |
            --test \
            --${{ matrix.arch }} \
            --target git-sync
