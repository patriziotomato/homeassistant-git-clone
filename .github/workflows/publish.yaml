name: Publish

# Tags are bare versions (0.7.0, 1.0.0), matching `version:` in
# git-sync/config.yaml. Pushing one publishes the images that version needs.
on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Scoped to this job only: whoever can push a tag can ship code to every
      # installation, so the write scope stays off every other job.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      # Release discipline becomes load-bearing once images exist: if the tag
      # and config.yaml disagree, Home Assistant offers an update that has no
      # image behind it and the install fails for users. Cheaper to stop here.
      - name: Tag and config.yaml must agree
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^version:[[:space:]]*//p' git-sync/config.yaml | tr -d "\"' ")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$tag' does not match 'version: $version' in git-sync/config.yaml."
            exit 1
          fi
          echo "Publishing $version for ${{ matrix.arch }}"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same action and arguments as the test build in builder.yaml, without
      # --test, so the image is pushed instead of discarded. Stays on @master
      # for the reason recorded there.
      - name: Build and publish
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target git-sync \
            --image {arch}-git-sync \
            --docker-hub ghcr.io/patriziotomato
