name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      # All three suites need only git and the standard library — no install step.
      - name: Git engine against a local bare repo
        run: python3 tests/test_git_ops.py

      - name: German/English dictionaries in sync
        run: python3 tests/test_i18n.py

      - name: Auto-commit quiet period
        run: python3 tests/test_sync.py
